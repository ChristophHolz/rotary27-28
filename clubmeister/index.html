const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)), bu=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
const SK='rk:'+location.pathname;
async function zeige(K){const ck=await crypto.subtle.importKey('raw',K,'AES-GCM',false,['decrypt']);
 const h=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(D.iv)},ck,ub(D.ct)));
 const ab='<a href="#" onclick="localStorage.removeItem(`'+SK+'`);sessionStorage.removeItem(`'+SK+'`);location.reload();return false" style="position:fixed;right:10px;bottom:10px;z-index:99;font:12px -apple-system,Helvetica,sans-serif;background:rgba(0,0,0,.55);color:#fff;padding:5px 9px;border-radius:12px;text-decoration:none">Abmelden</a>';
 document.open();document.write(h.replace('</body>',ab+'</body>'));document.close();}
(async()=>{const k=localStorage.getItem(SK)||sessionStorage.getItem(SK);if(!k)return;
 if(document.readyState!=='complete')await new Promise(r=>addEventListener('load',r,{once:true}));  /* sonst schreibt document.write in die noch offene Login-Seite hinein */
 try{await zeige(ub(k));}catch(x){localStorage.removeItem(SK);sessionStorage.removeItem(SK);}})();
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('b'),m=document.getElementById('msg');
 b.disabled=true;b.textContent='Prüfe …';m.textContent='';
 const u=document.getElementById('u').value.trim(),pw=document.getElementById('p').value;
 try{const enc=new TextEncoder().encode(u.toLowerCase()+'\n'+pw);
  const base=await crypto.subtle.importKey('raw',enc,'PBKDF2',false,['deriveKey']);let K=null;
  for(const v of D.env){try{const W=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:ub(v.s),iterations:D.iter},base,{name:'AES-GCM',length:256},false,['decrypt']);
   K=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(v.i)},W,ub(v.c));break;}catch(x){}}
  if(!K)throw 0;
  (document.getElementById('r').checked?localStorage:sessionStorage).setItem(SK,bu(K));
  try{if(window.PasswordCredential)await navigator.credentials.store(new PasswordCredential({id:u,password:pw,name:u}));}catch(x){}
  location.reload();   /* echte Navigation nach dem Absenden: Passwortmanager (Chrome, Safari/iCloud-Schlüsselbund) bieten Speichern an */
 }catch(x){m.textContent='Benutzer oder Passwort falsch.';b.disabled=false;b.textContent='Anmelden';}});
